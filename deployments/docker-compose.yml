services:
  broker:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: rabbitmq-lite:${VERSION:-dev}
    container_name: rabbitmq-lite
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      RABBITMQ_LITE_ADDRESS: ":8080"
      RABBITMQ_LITE_STORAGE_DSN: "/app/data/broker.db"
      RABBITMQ_LITE_LOG_LEVEL: "info"
      RABBITMQ_LITE_LOG_FORMAT: "json"
    volumes:
      - broker-data:/app/data
    healthcheck:
      test: ["CMD", "/app/brokerd", "-version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: rabbitmq-lite-prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - broker

volumes:
  broker-data:
