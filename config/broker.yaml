server:
  address: ":8080"
  read_timeout: 10s
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 20s
  max_body_bytes: 1048576

storage:
  driver: sqlite
  dsn: data/broker.db
  busy_timeout: 5s
  journal_mode: WAL
  synchronous: NORMAL
  max_open_conns: 1

engine:
  reclaim_interval: 5s
  visibility_timeout: 30s
  max_attempts: 3

retry:
  max_attempts: 3
  initial_interval: 500ms
  max_interval: 5m
  multiplier: 2.0
  jitter_fraction: 0.2

schemas:
  directory: schemas

logging:
  level: info
  format: json

topology:
  exchanges:
    - name: erp.events
      kind: topic
      durable: true
    - name: erp.broadcast
      kind: fanout
      durable: true

  queues:
    - name: customer-sync
      durable: true
      max_attempts: 3
      visibility_timeout: 30s
      schema: customer
    - name: invoice-processing
      durable: true
      max_attempts: 5
      visibility_timeout: 60s
      schema: invoice
    - name: inventory-sync
      durable: true
      max_attempts: 3
      visibility_timeout: 30s
      schema: inventory-adjustment
    - name: employee-sync
      durable: true
      max_attempts: 3
      visibility_timeout: 30s
      schema: employee
    - name: audit-log
      durable: true
      max_attempts: 2
      visibility_timeout: 15s

  bindings:
    - exchange: erp.events
      queue: customer-sync
      routing_key: customer.#
    - exchange: erp.events
      queue: invoice-processing
      routing_key: invoice.#
    - exchange: erp.events
      queue: inventory-sync
      routing_key: inventory.#
    - exchange: erp.events
      queue: employee-sync
      routing_key: employee.#
    - exchange: erp.events
      queue: audit-log
      routing_key: "#"
